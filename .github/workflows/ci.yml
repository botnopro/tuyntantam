# Kiểm tra mỗi lần push/PR: format, lint, typecheck, test (Postgres thật), build production, audit phụ thuộc.
# Vercel vẫn tự deploy khi push main; bật "Require status checks" cho nhánh main để chặn merge khi CI đỏ.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tuyn
          POSTGRES_PASSWORD: tuyn_ci
          POSTGRES_DB: tuyntantam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tuyn -d tuyntantam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Chỉ dùng trong CI, không phải bí mật thật
      DATABASE_URL: postgres://tuyn:tuyn_ci@localhost:5432/tuyntantam
      TEST_DATABASE_URL: postgres://tuyn:tuyn_ci@localhost:5432/tuyntantam_test
      SESSION_SECRET: ci-session-secret-khong-dung-o-production-0123456789
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build dựng sẵn trang từ DB → cần schema + nội dung như production
      - name: Migrate + seed DB build
        run: |
          node scripts/migrate.mjs
          npm run db:seed

      - name: Build
        run: npm run build

      - name: Audit phụ thuộc production
        run: npm audit --omit=dev --audit-level=high

# Tự mở PR cập nhật thư viện mỗi tuần, gom vào một PR. Chỉ bản minor/patch — bản major (TypeScript, ESLint,
# Next, React…) hay đổi cách dùng nên nâng thủ công. Bản vá bảo mật vẫn được mở riêng khi có.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
